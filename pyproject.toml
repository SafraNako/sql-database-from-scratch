[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-database-from-scratch"
version = "0.1.0"
description = "A SQL database engine written from scratch in pure Python that reads and writes real SQLite database files: pager with a rollback journal, B-trees, a SQL parser and executor, checked against SQLite itself"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SafraNako" }]
keywords = ["database", "sql", "sqlite", "b-tree", "pager", "journal", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Database :: Database Engines/Servers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SafraNako/sql-database-from-scratch"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
ksql = "kendi_db.shell:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
